[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
authors = ["insd47"]
license = "MIT"
repository = "https://github.com/insd47/branchline"

[workspace.dependencies]
aws-credential-types = "1"
aws-sigv4 = "1.6"
aws-types = "1"
bon = "3.10.2"
bytes = "1"
http = "1"
percent-encoding = "2"
prettyplease = "0.3"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
serde_html_form = "0.2"
serde_json = "1"
syn = { version = "3", features = ["full", "visit-mut"] }
thiserror = "2"
typify = "0.8"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
self_named_module_files = "warn"
redundant_pub_crate = "warn"
