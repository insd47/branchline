[package]
name = "branchline"
description = "Runtime for clients generated by branchline-build: a resource chain that follows the OpenAPI path tree"
keywords = ["openapi", "client", "rest", "sigv4", "codegen"]
categories = ["api-bindings", "web-programming::http-client"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"

[features]
default = ["bon"]
# Builders for generated types (`X::builder().a(1).build()`). Turn off together with `Generator::builders(false)`.
bon = ["dep:bon"]
# `Http`: a transport that sends requests with reqwest to a base URL.
reqwest = ["dep:reqwest", "dep:url"]
# `SigV4`: `Http` plus AWS SigV4 signing, for IAM-authenticated endpoints such as Lambda Function URLs.
sigv4 = ["reqwest", "dep:aws-credential-types", "dep:aws-sigv4", "dep:aws-types"]

[dependencies]
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }
bon = { workspace = true, optional = true }
bytes.workspace = true
http.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_html_form.workspace = true
reqwest = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
url = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
